name: Build patched Codex

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: patched-codex-release
  cancel-in-progress: false

jobs:
  discover:
    name: Detect upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: release
        name: Resolve release tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          upstream_tag="$(scripts/latest-upstream-tag.sh)"
          release_tag="${upstream_tag}-patched.1"
          should_build=true

          set +e
          release_response="$(gh api --include \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" 2>&1)"
          release_status=$?
          set -e
          if [[ "${release_status}" -eq 0 ]]; then
            should_build=false
          elif ! grep -Eq '^HTTP/[0-9.]+ 404 ' <<<"${release_response}"; then
            printf '%s\n' "${release_response}" >&2
            echo "Unable to determine whether release ${release_tag} exists" >&2
            exit "${release_status}"
          fi

          {
            echo "upstream_tag=${upstream_tag}"
            echo "release_tag=${release_tag}"
            echo "should_build=${should_build}"
          } >> "${GITHUB_OUTPUT}"
          echo "Upstream tag: ${upstream_tag}"
          echo "Patched release tag: ${release_tag}"
          echo "Build required: ${should_build}"

  build:
    name: Build patched upstream release
    needs: discover
    if: needs.discover.outputs.should_build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rust-release-public.yml
    with:
      upstream_tag: ${{ needs.discover.outputs.upstream_tag }}
      release_tag: ${{ needs.discover.outputs.release_tag }}

  publish:
    name: Publish patched release
    needs:
      - discover
      - build
    if: needs.discover.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patched-codex-*
          merge-multiple: true
          path: dist
      - name: Create release without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.discover.outputs.upstream_tag }}
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          release_response="$(gh api --include \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1)"
          release_status=$?
          set -e
          if [[ "${release_status}" -eq 0 ]]; then
            echo "Release ${RELEASE_TAG} already exists; leaving it unchanged."
            exit 0
          elif ! grep -Eq '^HTTP/[0-9.]+ 404 ' <<<"${release_response}"; then
            printf '%s\n' "${release_response}" >&2
            echo "Unable to determine whether release ${RELEASE_TAG} exists" >&2
            exit "${release_status}"
          fi

          cat > release-notes.md <<EOF
          Patched build of upstream Codex tag \`${UPSTREAM_TAG}\`.

          This release applies the patch set in this repository. It is not an
          official OpenAI build and is not code-signed or notarized by OpenAI.
          See the repository README for supported targets and limitations.
          EOF
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Codex ${UPSTREAM_TAG} (patched.1)" \
            --notes-file release-notes.md \
            dist/*
